<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foothold</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport"></div>
      <div id="objective" class="hud"></div>
      <div id="hostiles" class="hud"></div>
      <div id="feed" class="hud"></div>
      <button id="logbtn" class="hud" title="Log (L)"></button>
      <button id="helpbtn" class="hud" title="How to play (H)"></button>
      <button id="setbtn" class="hud" title="Settings"></button>
      <div id="hint" class="hud" hidden></div>
      <aside id="logdrawer" hidden><div class="drawer-head">Log <span class="muted">L to close</span></div><div id="log-lines"></div></aside>
      <aside id="jobs" class="hud" hidden></aside>
      <aside id="intel" class="hud" hidden></aside>
      <div id="squad" class="hud"></div>
      <div id="bar" class="hud"></div>
      <div id="corner" class="hud"></div>
      <div id="targetpanel" class="hud" hidden></div>
      <div id="modal" hidden></div>
      <div id="tooltip" hidden></div>
      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
